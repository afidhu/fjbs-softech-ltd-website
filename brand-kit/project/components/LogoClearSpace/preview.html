<!doctype html>

<head><meta charset="utf-8"><title>LogoClearSpace</title>
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.wrap{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:var(--space-6);padding:var(--space-5);align-items:center}

.mins{display:grid;gap:var(--space-4)}.m{display:flex;align-items:center;gap:var(--space-4)}.m img{flex:none}.m p{margin:0;font-size:14px;line-height:20px;color:var(--ink-muted)}.m b{color:var(--ink);font-weight:600}
@media (max-width:640px){.wrap{grid-template-columns:minmax(0,1fr)}}</style></head>
