<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>LogoMisuse</title>
<style>body{margin:0;background:var(--surface);color:var(--ink);font-family:var(--font-sans)}.g{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--space-4);padding:var(--space-5)}
figure{margin:0;display:grid;gap:var(--space-2);min-width:0}.bx{position:relative;display:grid;place-items:center;height:128px;overflow:hidden;border:1px solid var(--border);border-radius:var(--radius-md)}.bx img{width:62%;height:auto}
.crop{display:block;width:70%;overflow:hidden}.crop img{width:150%;max-width:none;margin-left:-16%;display:block}
.no{position:absolute;top:var(--space-2);right:var(--space-2);display:block;color:#bd2f18;background:var(--paper);border-radius:var(--radius-full)}
figcaption{font-size:14px;line-height:20px;color:var(--ink)}
@media (max-width:640px){.g{grid-template-columns:repeat(2,minmax(0,1fr))}}</style></head>
<body>
<div class="g"><figure><div class="bx" style="background:var(--paper)"><img src="/_blob/a5c841ba0bd6b782ef0bcbcf67856f99" alt="" style="transform:scaleX(1.25) scaleY(.72)"><span class="no"><svg class="fj-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></svg></span></div><figcaption>Do not stretch it</figcaption></figure><figure><div class="bx" style="background:var(--paper)"><img src="/_blob/a5c841ba0bd6b782ef0bcbcf67856f99" alt="" style="filter:hue-rotate(120deg)"><span class="no"><svg class="fj-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></svg></span></div><figcaption>Do not change the colours</figcaption></figure><figure><div class="bx" style="background:var(--paper)"><img src="/_blob/a5c841ba0bd6b782ef0bcbcf67856f99" alt="" style="transform:rotate(-14deg)"><span class="no"><svg class="fj-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></svg></span></div><figcaption>Do not rotate it</figcaption></figure><figure><div class="bx" style="background:var(--paper)"><img src="/_blob/a5c841ba0bd6b782ef0bcbcf67856f99" alt="" style="filter:drop-shadow(5px 6px 2px rgba(16,26,46,.75))"><span class="no"><svg class="fj-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></svg></span></div><figcaption>Do not add shadows or bevels</figcaption></figure><figure><div class="bx" style="background:var(--midnight)"><img src="/_blob/a5c841ba0bd6b782ef0bcbcf67856f99" alt=""><span class="no"><svg class="fj-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></svg></span></div><figcaption>Do not use primary on dark</figcaption></figure><figure><div class="bx" style="background:var(--paper)"><span class="crop"><img src="/_blob/a5c841ba0bd6b782ef0bcbcf67856f99" alt=""></span><span class="no"><svg class="fj-ic" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10" /><path d="m15 9-6 6" /><path d="m9 9 6 6" /></svg></span></div><figcaption>Do not crop the globe</figcaption></figure></div>
</body>
</html>
